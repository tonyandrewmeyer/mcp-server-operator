[project]
name = "mcp-server-workload"
version = "0.0.1"
requires-python = ">=3.10"
description = "MCP server workload for the mcp-server Juju charm"

dependencies = [
    "mcp[cli]",
    "PyJWT[crypto]",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-asgi",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "coverage[toml]",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
pythonpath = ["src"]

[tool.ty.environment]
extra-paths = ["src"]

# Linting tools configuration

[tool.ruff]
line-length = 99
extend-exclude = [
    "lib",
    "__pycache__",
    "*.egg_info",
    "lib/charms",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
