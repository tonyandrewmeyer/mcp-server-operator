# uv version resolved from root uv.toml

name: Charm CI

on:
  push:
    branches: [main]
    paths:
      - "charm/**"
      - "workload/src/**"
      - "demo/principal/**"
      - ".github/workflows/charm.yaml"
  pull_request:
    paths:
      - "charm/**"
      - "workload/src/**"
      - "demo/principal/**"
      - ".github/workflows/charm.yaml"

permissions:
  contents: read

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run --group lint ruff format --check --diff src tests
      - run: uv run --group lint ruff check src tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run --group lint codespell .
      - run: uv run --group lint ty check src/charm.py src/mcp_server.py

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: |
          uv run --group unit coverage run --source=src -m pytest -v -s --tb native tests/unit
          uv run --group unit coverage report
        env:
          PYTHONPATH: lib:src

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [format-check, lint, unit-test]
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Juju
        uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3 # main
        with:
          provider: lxd
      - name: Sync workload files
        run: make -C .. sync-workload
      - name: Pack charm
        run: charmcraft pack
      - name: Pack demo principal
        run: charmcraft pack
        working-directory: ${{ github.workspace }}/demo/principal
      - name: Run integration tests
        run: uv run --group integration pytest -v -s --tb native --log-cli-level=INFO tests/integration
        env:
          PYTHONPATH: lib:src
